<!DOCTYPE html>
<html lang="en">
<head>
<title>Canvas Heart</title>  
<style>
    #sean{
        border: black solid 2px;
    }
</style>
</head>
<body>
<h1>Self Portriat</h1>
<canvas id="sean" width="800" height="700">
</canvas>
<script>
    //MAGIC
    const canvas = document.getElementById('sean');
    const ctx = canvas.getContext('2d');
 
    //background
    ctx.fillStyle = 'gray';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    //heart wide made out of lines
    ctx.fillStyle = 'red';
    ctx.beginPath();
    ctx.moveTo(400, 300);
    ctx.lineTo(300, 200);
    ctx.lineTo(200, 300);
    ctx.lineTo(400, 500);
    ctx.lineTo(600, 300);
    ctx.lineTo(500, 200);
    ctx.closePath();
    ctx.fill();
</script>
</body>
