<!DOCTYPE html>
<head>
    <style>
            canvas { border: 1px solid black; }
        </style>
    <title>Having a cool parade</title>
</head>
<body>
            <h1>Cool parade</h1>
            <canvas id="myCanvas" width="1690" height="800" border></canvas>
            <script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

let posX = 100;
let posY = 100;
let time = 0;

function drawBackground() {
    // 1. The Sky
    ctx.fillStyle = "#87CEEB"; // Sky blue
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. The City Skyline (Distant Buildings)
    ctx.fillStyle = "#4a4e69"; // Muted blue-grey
    ctx.fillRect(50, 400, 80, 250);   // Building 1
    ctx.fillRect(150, 350, 100, 300); // Building 2
    ctx.fillRect(300, 450, 60, 200);  // Building 3
    ctx.fillRect(450, 300, 120, 350); // Building 4
    // (Repeat or loop this to fill the width of the canvas)

    // 3. The Sidewalk
    ctx.fillStyle = "#bdc3c7"; // Light grey
    ctx.fillRect(0, 650, canvas.width, 30);

    // 4. The Road (Bottom of the screen)
    ctx.fillStyle = "#333333"; // Dark asphalt
    ctx.fillRect(0, 680, canvas.width, 120);

    // 5. Yellow Road Lines
    ctx.strokeStyle = "#f1c40f";
    ctx.lineWidth = 5;
    ctx.setLineDash([40, 20]); // Dashed line effect
    ctx.beginPath();
    ctx.moveTo(0, 740);
    ctx.lineTo(canvas.width, 740);
    ctx.stroke();
    ctx.setLineDash([]); // Reset dash for other drawings
}

// 1. Party Bus (with 3 passengers and streamers)
function drawAll(x, y) {
    const roadY = y + 580;
    drawBlueTruck(x, roadY);
    drawTrailer(x + 150, roadY);
    drawLimo(x + 300, roadY);
    drawSportsCar(x + 500, roadY);
    drawTractor(x + 650, roadY);
    drawBus(x + 800, roadY);
    drawPurpleFloat(x + 950, roadY);
    drawScooter(x + 1100, roadY);
    drawBlackVan(x + 1200, roadY);
    drawCarriage(x + 1350, roadY);
}

// 1. Blue Truck with a Driver
function drawBlueTruck(x, y) {
    ctx.fillStyle = 'blue';
    ctx.fillRect(x, y + 10, 80, 30); 
    ctx.fillRect(x + 50, y - 10, 30, 20); // Cabin
    drawPerson(x + 55, y - 5, 'white'); // Driver in cabin
    drawWheels(x + 15, x + 65, y + 40);
}

// 2. Brown Trailer with a Parade Performer
function drawTrailer(x, y) {
    ctx.fillStyle = 'saddlebrown';
    ctx.fillRect(x, y + 20, 90, 15);
    drawPerson(x + 40, y + 5, 'yellow'); // Performer standing on trailer
    drawWheels(x + 20, x + 70, y + 35);
}

// 3. Silver Limo with two Party-goers
function drawLimo(x, y) {
    ctx.fillStyle = 'silver';
    ctx.fillRect(x, y + 10, 140, 30);
    ctx.fillStyle = 'black';
    ctx.fillRect(x + 10, y + 15, 120, 10); // Tinted window strip
    drawPerson(x + 40, y, 'pink'); // Passenger 1
    drawPerson(x + 80, y, 'cyan'); // Passenger 2
    drawWheels(x + 20, x + 120, y + 40);
}

// 4. Red Sports Car with a Racing Driver
function drawSportsCar(x, y) {
    ctx.fillStyle = 'red';
    ctx.beginPath();
    ctx.moveTo(x, y + 40);
    ctx.lineTo(x + 80, y + 40);
    ctx.lineTo(x + 70, y + 10);
    ctx.lineTo(x + 10, y + 10);
    ctx.fill();
    drawPerson(x + 35, y + 5, 'red'); // Driver
    drawWheels(x + 15, x + 65, y + 40);
}

// 5. Green Tractor with a Farmer
function drawTractor(x, y) {
    ctx.fillStyle = 'green';
    ctx.fillRect(x + 30, y, 40, 40); // Engine
    ctx.fillRect(x, y + 20, 30, 20); // Front
    drawPerson(x + 45, y - 10, 'blue'); // Farmer sitting high
    drawWheels(x + 15, x + 55, y + 40);
}

// 6. Yellow School Bus with many Kids
function drawBus(x, y) {
    ctx.fillStyle = 'gold';
    ctx.fillRect(x, y, 100, 50);
    // Draw three kids in windows
    drawPerson(x + 20, y + 15, 'orange');
    drawPerson(x + 50, y + 15, 'purple');
    drawPerson(x + 80, y + 15, 'lime');
    drawWheels(x + 20, x + 80, y + 50);
}

// 7. Purple Float with a Queen/King and a Flag
function drawPurpleFloat(x, y) {
    ctx.fillStyle = 'rebeccapurple';
    ctx.fillRect(x, y + 20, 100, 20);
    // Flag pole
    ctx.strokeStyle = 'gold';
    ctx.strokeRect(x + 10, y - 20, 2, 40);
    drawPerson(x + 50, y + 5, 'gold'); // Royal person
    drawWheels(x + 20, x + 80, y + 40);
}

// 8. Orange Scooter with a Rider
function drawScooter(x, y) {
    ctx.strokeStyle = 'orange';
    ctx.lineWidth = 5;
    ctx.strokeRect(x, y + 35, 40, 2);
    drawPerson(x + 15, y + 20, 'black'); // Scooter rider
    drawWheels(x + 5, x + 35, y + 40);
}

// 9. Black Van with a Driver
function drawBlackVan(x, y) {
    ctx.fillStyle = 'black';
    ctx.fillRect(x, y, 90, 45);
    ctx.fillStyle = 'lightblue';
    ctx.fillRect(x + 60, y + 5, 20, 15); // Windshield
    drawPerson(x + 65, y + 10, 'white'); // Driver
    drawWheels(x + 20, x + 70, y + 45);
}

// 10. Pink Carriage with a Princess
function drawCarriage(x, y) {
    ctx.strokeStyle = 'hotpink';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, 60, 40);
    drawPerson(x + 30, y + 15, 'hotpink'); // Princess inside
    drawWheels(x + 10, x + 50, y + 45);
}

// HELPER: To draw wheels with rims
function drawWheels(x1, x2, y) {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(x1, y, 8, 0, Math.PI * 2);
    ctx.arc(x2, y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'silver'; // Rim
    ctx.beginPath();
    ctx.arc(x1, y, 3, 0, Math.PI * 2);
    ctx.arc(x2, y, 3, 0, Math.PI * 2);
    ctx.fill();
}

// HELPER: To draw a person
function drawPerson(x, y, shirtColor) {
    ctx.fillStyle = 'bisque'; // Skin
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2); // Head
    ctx.fill();
    ctx.fillStyle = shirtColor;
    ctx.fillRect(x - 4, y + 6, 8, 10); // Body/Shirt
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    
    let speed = 3; 
    let startX = -200; // Hidden off-screen to the left
    let roadY = 680;

    // 1. Blue Truck: Starts immediately
    if (time > 80) drawBlueTruck(startX + (time * speed), roadY);

    // 2. Trailer: Starts after 100 frames
    if (time > 100) drawTrailer(startX + ((time - 100) * speed), roadY);

    // 3. Limo: Starts after 250 frames
    if (time > 250) drawLimo(startX + ((time - 250) * speed), roadY);

    // 4. Sports Car: Starts after 400 frames
    if (time > 400) drawSportsCar(startX + ((time - 400) * speed), roadY);

    // 5. Tractor: Starts after 550 frames
    if (time > 550) drawTractor(startX + ((time - 550) * speed), roadY);

    // 6. Bus: Starts after 700 frames
    if (time > 700) drawBus(startX + ((time - 700) * speed), roadY);

    // 7. Purple Float: Starts after 850 frames
    if (time > 850) drawPurpleFloat(startX + ((time - 850) * speed), roadY);

    // 8. Scooter: Starts after 1000 frames
    if (time > 1000) drawScooter(startX + ((time - 1000) * speed), roadY);

    // 9. Black Van: Starts after 1150 frames
    if (time > 1150) drawBlackVan(startX + ((time - 1150) * speed), roadY);

    // 10. Carriage: Starts after 1300 frames
    if (time > 1300) drawCarriage(startX + ((time - 1300) * speed), roadY);

    // RESTART LOGIC: If the last car (Carriage) is off-screen, reset time
    // 2000 is a safe bet for a 1700px wide canvas
    if (time > 2000) {
        time = 0; 
    }

    time++; // Keep the clock ticking
    requestAnimationFrame(animate);
}
animate();
            </script>
</body>
