<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Animate</title>
        <style>
            canvas { border: 1px solid black; }
        </style>
    </head>
    <body>
        <h2>Hello animations</h2>
        <canvas id="myCanvas" width="800" height="800"></canvas>

        <script>
            console.log("hi")
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// 1. Create a variable to track position
let posX = 0; 
let posY = 0;
let speedX = 5;
let speedY = 5;
let radius = 5;
let particles = [];
let keys = {};

const mapObjects = [
    {x: -130, y: -240, w: 300, h: 300, color: 'grey'}, // castle
    {x: -60, y: -190, w: 160, h: 250, color: 'saddlebrown'}, // big door
    {x: 800, y: 100, w: 100, h: 200, color: 'blue' },
    {x: -500, y: 300, w: 200, h: 50, color: 'green'},
    {x: 1200, y: 800, w: 300, h: 300, color: 'red'}
];

    // Clear the whole canvas before drawing the new position
function drawRect(x, y) {
    
    ctx.fillStyle = 'tan';
    ctx.fillRect(x, y, 30, 30);

    ctx.fillStyle = 'tan';
    ctx.fillRect(x+10, y+-30, 10, 30);

ctx.fillStyle = 'tan';
ctx.beginPath();
ctx.arc(x + 15, y + -40, 29, 0, 2 * Math.PI); 
ctx.fill();

ctx.fillStyle = 'white';
ctx.beginPath();
ctx.arc(x + 35, y + -40, radius, 0, 2 * Math.PI); 
ctx.fill();

ctx.fillStyle = 'white';
ctx.beginPath();
ctx.arc(x + -5, y + -40, radius, 0, 2 * Math.PI); 
ctx.fill();

    ctx.fillStyle = 'tan';
    ctx.fillRect(x, y+30, 10, 30);
    
    ctx.fillStyle = 'tan';
    ctx.fillRect(x+20, y+30, 10, 30);

    ctx.fillStyle = 'tan';
    ctx.fillRect(x+35, y, 10, 40,);

    ctx.fillStyle = 'tan';
    ctx.fillRect(x+-15, y, 10, 40,);
}



function animate() {  
    // 1. Calculate camera position (center of screen minus player position)
    // 300 and 200 are half of your canvas width/height
   let cameraX = posX - (canvas.width / 2) + 15; 
    let cameraY = posY - (canvas.height / 2) + 15;

    // 2. Reset and Clear...
    ctx.setTransform(1, 0, 0, 1, 0, 0); 
    ctx.clearRect(0, 0, canvas.width, canvas.height); 

    // 3. Apply Camera...
    ctx.translate(-cameraX, -cameraY);

    // 4. Update player position (your existing key logic)
    if (keys['ArrowRight']) posX += 10;
    if (keys['ArrowLeft'])  posX -= 10;
    if (keys['ArrowUp'])    posY -= 10;
    if (keys['ArrowDown'])  posY += 10;

// 5. Draw the world (Infinite Grid)
ctx.strokeStyle = "#e0e0e0"; // Using stroke for thinner lines
ctx.lineWidth = 1;

let gridSize = 100;

// Calculate where the grid should start drawing relative to the camera
// Math.floor(cameraX / gridSize) * gridSize find the nearest grid intersection
let startX = Math.floor(cameraX / gridSize) * gridSize;
let startY = Math.floor(cameraY / gridSize) * gridSize;

// Draw vertical lines across the width of the canvas + one extra buffer
for (let x = startX; x < startX + canvas.width + gridSize; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, cameraY);
    ctx.lineTo(x, cameraY + canvas.height);
    ctx.stroke();
}

// Draw horizontal lines across the height of the canvas + one extra buffer
for (let y = startY; y < startY + canvas.height + gridSize; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(cameraX, y);
    ctx.lineTo(cameraX + canvas.width, y);
    ctx.stroke();
}

       // DRAW THE WORLD OBJECTS
    mapObjects.forEach(obj => {
        ctx.fillStyle = obj.color;
        ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
        
        // Add a little label so you know where you are
        ctx.fillStyle = "black";
        ctx.fillText(`Cords: ${obj.x}, ${obj.y}`, obj.x, obj.y - 10);
    });


    // 6. Draw player
    drawRect(posX, posY);

    requestAnimationFrame(animate);
}

// Start the loop
animate();
window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => { keys[e.key] = false; });
        </script>
    </body>
</html>
