<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Animate</title>
        <style>
            canvas { border: 1px solid black; }
        </style>
    </head>
    <body>
        <h2>Hello animations</h2>
        <canvas id="myCanvas" width="1600" height="800"></canvas>

        <script>
            console.log("hi")
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// 1. Create a variable to track position
let posX = 50; 
let posY = 100;
let speedX = 5;
let speedY = 5;
let radius = 5;
let particles = [];
let angle = 0;
let rotationSpeed = 0.1;



    // Clear the whole canvas before drawing the new position
function drawRect(x, y) {
    ctx.save(); // Save current state
    ctx.translate(x, y); // 2. Move origin to the object center
    ctx.rotate(angle);


    // 1. The Main Disc (Silver/Grey)
    ctx.fillStyle = '#9D00FF'; 
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, 2 * Math.PI);
    ctx.fill();

    // 2. The Iridescent Reflection (A subtle gradient or simple arc)
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0.5 * Math.PI, 1.2 * Math.PI); // A curved highlight
    ctx.stroke();

    // 3. The Inner Clear Plastic Ring
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, 2 * Math.PI);
    ctx.fill();

    // 4. The Center Hole (Matching the background)
    ctx.fillStyle = 'white'; // Change this to match your canvas background color
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, 2 * Math.PI);
    ctx.fill();
    
    // 5. The Outer Edge Outline
    ctx.strokeStyle = 'green';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
}

function animate() {  
    ctx.clearRect(0, 0, canvas.width, canvas.height); 

    // 1. Update positions
    posX += speedX;
    posY += speedY;
    angle += rotationSpeed;

    if (posX + 40 > canvas.width || posX < 40) {
        speedX *= -1;
    }

    if (posY + 40 > canvas.height || posY < 40) {
        speedY *= -1;
    }

    // 4. Draw
    drawRect(posX, posY);

    requestAnimationFrame(animate);
}

// Start the loop
animate();
        </script>
    </body>
</html>
