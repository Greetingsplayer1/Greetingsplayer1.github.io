<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Animate</title>
        <style>
            canvas { border: 1px solid black; }
        </style>
    </head>
    <body>
        <h2>Hello animations</h2>
        <canvas id="myCanvas" width="600" height="400"></canvas>

        <script>
            console.log("hi")
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// 1. Create a variable to track position
let posX = 50; 
let posY = 100;
let speedX = 5;
let speedY = 5;
let radius = 5;
let particles = [];


    // Clear the whole canvas before drawing the new position
function drawRect(x, y) {
    // 1. The Main Disc (Silver/Grey)
    ctx.fillStyle = '#9D00FF'; 
    ctx.beginPath();
    ctx.arc(x, y, 60, 0, 2 * Math.PI);
    ctx.fill();

    // 2. The Iridescent Reflection (A subtle gradient or simple arc)
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(x, y, 40, 0.5 * Math.PI, 1.2 * Math.PI); // A curved highlight
    ctx.stroke();

    // 3. The Inner Clear Plastic Ring
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(x, y, 15, 0, 2 * Math.PI);
    ctx.fill();

    // 4. The Center Hole (Matching the background)
    ctx.fillStyle = 'white'; // Change this to match your canvas background color
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, 2 * Math.PI);
    ctx.fill();
    
    // 5. The Outer Edge Outline
    ctx.strokeStyle = 'green';
    ctx.lineWidth = 2;
    ctx.stroke();
}

function animate() {  
    ctx.clearRect(0, 0, canvas.width, canvas.height); 

    // 1. Update positions
    posX += speedX;
    posY += speedY;

    // 2. Horizontal Bounce (Account for left arm at x-30 and right arm at x+90)
    if (posX + 90 > canvas.width || posX < 30) {
        speedX *= -1;
    }

    // 3. Vertical Bounce (Account for head at y-85 and feet at y+100)
    if (posY + 100 > canvas.height || posY < 85) {
        speedY *= -1;
    }

    // 4. Draw
    drawRect(posX, posY);

    requestAnimationFrame(animate);
}

// Start the loop
animate();
        </script>
    </body>
</html>
