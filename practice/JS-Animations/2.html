<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Animate</title>
        <style>
            canvas { border: 3px solid rgb(255, 0, 0); }
        </style>
    </head>
    <body>
        <h2>Hello animations</h2>
        <canvas id="myCanvas" width="1600" height="800"></canvas>

        <script>
            console.log("hi")
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// 1. Create a variable to track position
let posX = 50; 
let posY = 100;
let speedX = 4.7;
let speedY = 6.2;
let radius = 5;
let particles = [];
let angle = 0;
let rotationSpeed = 0.1;
let gravity = 1;



    // Clear the whole canvas before drawing the new position
function drawRect(x, y) {
    ctx.save(); 
    ctx.translate(x, y); 
    ctx.rotate(angle);

    // 1. The Main Disc (Silver/Grey)
    ctx.fillStyle = '#9D00FF'; 
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, 2 * Math.PI);
    ctx.fill();

    // 2. The Iridescent Reflection (Red Arc)
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0.5 * Math.PI, 1.2 * Math.PI); 
    ctx.stroke();

    // --- ADDED: DVD TEXT ON THE ARC ---
    ctx.save();
    ctx.fillStyle = "white";
    ctx.font = "bold 9px Arial";
    ctx.textAlign = "center";
    // This positions "DVD" right on top of your red arc
    // We rotate it to about 0.85*PI to center it in your 0.5 to 1.2 arc
    ctx.rotate(0.85 * Math.PI); 
    ctx.fillText("DVD", 0, -30); 
    ctx.restore();

    // 3. The Inner Clear Plastic Ring
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, 2 * Math.PI);
    ctx.fill();

    // 4. The Center Hole
    ctx.fillStyle = 'white'; 
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, 2 * Math.PI);
    ctx.fill();
    
    // 5. The Outer Edge Outline
    ctx.strokeStyle = 'green';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
}


function animate() {  
    ctx.clearRect(0, 0, canvas.width, canvas.height); 

    // 1. Update positions
    posX += speedX;
    posY += speedY;
    angle += rotationSpeed;

    if (posX + 40 > canvas.width || posX < 40) {
        speedX *= -1;
    }

    if (posY + 40 > canvas.height || posY < 40) {
        speedY *= -1;
    }

    // 4. Draw
    drawRect(posX, posY);

    requestAnimationFrame(animate);
}

// Start the loop
animate();
        </script>
    </body>
</html>
