<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Animate</title>
        <style>
            canvas { border: 1px solid black; }
        </style>
    </head>
    <body>
        <h2>Hello animations</h2>
        <canvas id="myCanvas" width="1000" height="800"></canvas>

        <script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// 1. Variables
let posX = -10; 
let posY = 1300;
let radius = 5;
let keys = {};
let stealthActive = false;
let bladeActive = false;
let bladeHeight = 0; 

const mapObjects = [
    // --- 1. THE MASSIVE WORLD (Moat pulled in closer) ---
    {x: -1500, y: -1400, w: 3000, h: 2500, color: '#006994'}, // Moat Water
    {x: -1000, y: -1200, w: 2000, h: 2000, color: '#2d8a2d'}, // Grass Land (Island)

    // --- 2. THE PATH & SHORTENED BRIDGE ---
    {x: -200, y: -400, w: 400, h: 1600, color: '#a89968'},    // Main Road
    {x: -200, y: -300, w: 400, h: 200, color: '#5d4037'},     // Shortened Wood Bridge
    {x: -200, y: -250, w: 400, h: 10, color: '#3e2723'},      // Plank Detail

    // --- 3. THE GRAND CASTLE ---
    {x: -800, y: -900, w: 1600, h: 600, color: '#808080'},   
    {x: -800, y: -1100, w: 250, h: 800, color: '#666'},      
    {x: 550, y: -1100, w: 250, h: 800, color: '#666'},       
    {x: -250, y: -950, w: 500, h: 650, color: '#555'},       
    {x: -150, y: -600, w: 300, h: 300, color: '#3e2723', isGate: true}, 

    // --- 4. DETAILED GUARDS ---
    // Left Guard
    {x: -745, y: -1250, w: 8, h: 230, color: '#5D4037'}, {x: -745, y: -1265, w: 8, h: 25, color: 'silver'},
    {x: -710, y: -1180, w: 50, h: 80, color: '#C0C0C0'}, {x: -715, y: -1185, w: 60, h: 20, color: '#999'},
    {x: -730, y: -1180, w: 15, h: 70, color: 'tan'}, {x: -655, y: -1180, w: 15, h: 70, color: 'tan'},
    {x: -710, y: -1100, w: 50, h: 25, color: '#283593'}, {x: -705, y: -1225, w: 40, h: 45, color: 'silver'},
    // Right Guard
    {x: 715, y: -1250, w: 8, h: 230, color: '#5D4037'}, {x: 715, y: -1265, w: 8, h: 25, color: 'silver'},
    {x: 640, y: -1180, w: 50, h: 80, color: '#C0C0C0'}, {x: 635, y: -1185, w: 60, h: 20, color: '#999'},
    {x: 620, y: -1180, w: 15, h: 70, color: 'tan'}, {x: 695, y: -1180, w: 15, h: 70, color: 'tan'},
    {x: 640, y: -1100, w: 50, h: 25, color: '#283593'}, {x: 645, y: -1225, w: 40, h: 45, color: 'silver'},

    // --- 5. MARKET DISTRICT ---
    {x: -550, y: 100, w: 120, h: 120, color: 'peru'}, {x: -570, y: 80, w: 160, h: 30, color: 'red'},
    {x: -550, y: 350, w: 120, h: 120, color: 'peru'}, {x: -570, y: 330, w: 160, h: 30, color: 'orange'},
    {x: 430, y: 100, w: 120, h: 120, color: 'peru'}, {x: 410, y: 80, w: 160, h: 30, color: 'blue'},
    {x: 430, y: 350, w: 120, h: 120, color: 'peru'}, {x: 410, y: 330, w: 160, h: 30, color: 'purple'},

    // --- 7. FARMLANDS & FLAGS ---
    {x: -2500, y: 1200, w: 500, h: 400, color: '#8b4513'}, 
    {x: -760, y: -1300, w: 10, h: 200, color: 'black'}, {x: -750, y: -1300, w: 150, h: 80, color: 'red'}, 
    {x: 600, y: -1300, w: 10, h: 200, color: 'black'}, {x: 610, y: -1300, w: 150, h: 80, color: 'red'}, 

    // --- 8. TURRETS ---
    {x: -650, y: -980, w: 100, h: 80, color: '#444'},
    {x: -450, y: -980, w: 100, h: 80, color: '#444'},
    {x: -250, y: -980, w: 100, h: 80, color: '#444'},
    {x: -50,  y: -980, w: 100, h: 80, color: '#444'},
    {x: 150,  y: -980, w: 100, h: 80, color: '#444'},
    {x: 350,  y: -980, w: 100, h: 80, color: '#444'},
    {x: 550,  y: -980, w: 100, h: 80, color: '#444'}
];

const enemies = [
    { x: 300, y: 300, homeX: 300, homeY: 300, size: 40, color: 'white', alert: false, scaredTimer: 0 },
    { x: 300, y: 300, homeX: 200, homeY: 350, size: 40, color: 'white', alert: false, scaredTimer: 0 }
];



function drawRect(x, y) {
    ctx.save();
    if (stealthActive) ctx.globalAlpha = 0.5;

    // Cloak
    ctx.fillStyle = '#1a1a1a'; 
    ctx.beginPath();
    ctx.moveTo(x - 10, y + 20);
    ctx.lineTo(x - 20, y + 100);
    ctx.lineTo(x + 50, y + 100);
    ctx.lineTo(x + 40, y + 20);
    ctx.fill();

    // Legs
    ctx.fillStyle = '#111';
    ctx.fillRect(x + 4, y + 60, 10, 35);
    ctx.fillRect(x + 16, y + 60, 10, 35);
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(x + 3, y + 90, 12, 12);
    ctx.fillRect(x + 15, y + 90, 12, 12);

    // Body
    ctx.fillStyle = '#2c2c2c';
    ctx.fillRect(x - 2, y + 5, 34, 70); 

    // Hood
    ctx.beginPath();
    ctx.arc(x + 15, y - 10, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 5, y - 20);
    ctx.lineTo(x + 15, y - 45);
    ctx.lineTo(x + 25, y - 20);
    ctx.fill();

    // Face/Eyes
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(x + 15, y - 5, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 6, y - 12, 7, 2); 
    ctx.fillRect(x + 17, y - 12, 7, 2);

    // Belt
    ctx.fillStyle = '#8e0000';
    ctx.fillRect(x - 6, y + 45, 42, 12);

    // Blade Logic
    if (bladeHeight > 0) {
        ctx.fillStyle = 'silver';
        ctx.fillRect(x - 14, y + 65, 4, bladeHeight); 
    }

    ctx.restore();
}

function animate() {  
    let cameraX = posX - (canvas.width / 2) + 15; 
    let cameraY = posY - (canvas.height / 2) + 15;

    ctx.setTransform(1, 0, 0, 1, 0, 0); 
    ctx.clearRect(0, 0, canvas.width, canvas.height); 

    ctx.fillStyle = "#2d8a2d"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height); 
    
    ctx.translate(-cameraX, -cameraY);

    let currentSpeed = stealthActive ? 4 : 10;
    if (keys['d']) posX += currentSpeed;
    if (keys['a']) posX -= currentSpeed;
    if (keys['w']) posY -= currentSpeed;
    if (keys['s']) posY += currentSpeed;

    if (bladeActive && bladeHeight < 25) bladeHeight += 15;
    if (!bladeActive && bladeHeight > 0) bladeHeight -= 15;

    mapObjects.forEach(obj => {
        ctx.fillStyle = obj.color;
        ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
    });

enemies.forEach(enemy => {
    let dx = posX - enemy.x;
    let dy = posY - enemy.y;
    let distance = Math.sqrt(dx * dx + dy * dy);

    // 1. Detection
    let scaredOfBlade = (distance < 400 && bladeActive);
    let scaredOfGhost = (distance < 80 && stealthActive);

    if (scaredOfBlade || scaredOfGhost) {
        enemy.alert = true;
        enemy.scaredTimer = 120; // Stay scared for 120 frames (approx 2 seconds)
    }

    // 2. State Management
    if (enemy.scaredTimer > 0) {
        enemy.scaredTimer--; // Tick down the timer
        enemy.color = 'yellow';
        
        // FLEE: Move away from player
        let angle = Math.atan2(dy, dx);
        enemy.x -= Math.cos(angle) * 5;
        enemy.y -= Math.sin(angle) * 5;
    } else {
        enemy.alert = false;
        enemy.color = 'white';

        // RETURN HOME: Only if not scared anymore
        let homeDx = enemy.homeX - enemy.x;
        let homeDy = enemy.homeY - enemy.y;
        let distToHome = Math.sqrt(homeDx * homeDx + homeDy * homeDy);

        if (distToHome > 5) {
            let angleToHome = Math.atan2(homeDy, homeDx);
            enemy.x += Math.cos(angleToHome) * 5;
            enemy.y += Math.sin(angleToHome) * 5;
        }
    }

    // 3. Draw
    ctx.fillStyle = enemy.color;
    ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
});

    drawRect(posX, posY);
    requestAnimationFrame(animate);
}
animate();
window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    keys[key] = true;

    // Toggle Blade (Q)
    if (key === 'q') {
        bladeActive = !bladeActive;
    }

    // Toggle Stealth (E)
    if (key === 'e') {
        stealthActive = !stealthActive;
    }

    
});
window.addEventListener('keyup', (e) => { 
    keys[e.key.toLowerCase()] = false; 
});
        </script>
    </body>
</html>
