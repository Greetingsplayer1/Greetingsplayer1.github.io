<!DOCTYPE html>
<html lang="en">
<head>
    <title>Animate</title>
    <style>
        canvas { border: 1px solid black; background: #2d8a2d; }
    </style>
</head>
<body>
    <h2>Stealth Game - Press 'E' for Stealth, 'Space' to Attack, 'Shift' to Sprint</h2>
    <canvas id="myCanvas" width="1000" height="800"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        // 1. Variables
        let posX = -10; 
        let posY = 1300;
        let keys = {};
        let stealthActive = false;
        let bladeActive = false;
        let bladeHeight = 0; 
        let speedMultiplier = 1; 
        const sprintSpeed = 2;   

        const mapObjects = [
            {x: -1500, y: -1400, w: 3000, h: 2500, color: '#006994'}, 
            {x: -1000, y: -1200, w: 2000, h: 2000, color: '#2d8a2d'}, 
            {x: -200, y: -400, w: 400, h: 1600, color: '#a89968'},    
            {x: -200, y: -300, w: 400, h: 200, color: '#5d4037'},     
            {x: -200, y: -250, w: 400, h: 10, color: '#3e2723'},      
            {x: -800, y: -900, w: 1600, h: 600, color: '#808080'},   
            {x: -800, y: -1100, w: 250, h: 800, color: '#666'},      
            {x: 550, y: -1100, w: 250, h: 800, color: '#666'},       
            {x: -250, y: -950, w: 500, h: 650, color: '#555'},       
            {x: -150, y: -600, w: 300, h: 300, color: '#3e2723', isGate: true}
        ];

        let enemies = [
    { 
        x: 300, y: 300, homeX: 300, homeY: 300, size: 40, color: 'white', 
        isDead: false, respawnTimer: 0, scaredTimer: 0,
        angle: 0 // 0 is facing Right, Math.PI is facing Left
    }
];;

        function drawRect(x, y) {
            ctx.save();
            if (stealthActive) ctx.globalAlpha = 0.5;

            // Cloak
            ctx.fillStyle = '#1a1a1a'; 
            ctx.beginPath();
            ctx.moveTo(x - 10, y + 20);
            ctx.lineTo(x - 20, y + 100);
            ctx.lineTo(x + 50, y + 100);
            ctx.lineTo(x + 40, y + 20);
            ctx.fill();

            // Legs
            ctx.fillStyle = '#111';
            ctx.fillRect(x + 4, y + 60, 10, 35);
            ctx.fillRect(x + 16, y + 60, 10, 35);
            
            // Body
            ctx.fillStyle = '#2c2c2c';
            ctx.fillRect(x - 2, y + 5, 34, 70); 

            // Hood
            ctx.beginPath();
            ctx.arc(x + 15, y - 10, 35, 0, Math.PI * 2);
            ctx.fill();

            // Face/Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + 15, y - 5, 24, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 6, y - 12, 7, 2); 
            ctx.fillRect(x + 17, y - 12, 7, 2);

            // Blade
            if (bladeHeight > 0) {
                ctx.fillStyle = 'silver';
                ctx.fillRect(x - 14, y + 65, 4, bladeHeight); 
            }
            ctx.restore();
        }

        function animate() {  
            let cameraX = posX - (canvas.width / 2) + 15; 
            let cameraY = posY - (canvas.height / 2) + 15;

            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            ctx.fillStyle = "#2d8a2d"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height); 
            
            ctx.translate(-cameraX, -cameraY);

            // Movement
            let baseSpeed = stealthActive ? 4 : 10;
            let currentSpeed = baseSpeed * speedMultiplier;

            if (keys['d']) posX += currentSpeed;
            if (keys['a']) posX -= currentSpeed;
            if (keys['w']) posY -= currentSpeed;
            if (keys['s']) posY += currentSpeed;

            // Blade Animation
            if (bladeActive && bladeHeight < 25) bladeHeight += 5;
            if (!bladeActive && bladeHeight > 0) bladeHeight -= 5;

            // Draw World
            mapObjects.forEach(obj => {
                ctx.fillStyle = obj.color;
                ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
            });

            // Enemy Logic
           // --- FIXED ENEMY LOOP ---
enemies.forEach(enemy => {
    // 1. RESPOND TO DEATH
    if (enemy.isDead) {
        enemy.respawnTimer--;
        if (enemy.respawnTimer <= 0) {
            enemy.isDead = false;
            enemy.x = enemy.homeX; 
            enemy.y = enemy.homeY;
        }
        return; 
    }

    // 2. CALCULATE DISTANCE (MUST BE FIRST)
    let dx = posX - enemy.x;
    let dy = posY - enemy.y;
    let distance = Math.sqrt(dx * dx + dy * dy);

    // 3. VISION CONE MATH
    let angleToPlayer = Math.atan2(dy, dx);
    let angleDiff = Math.abs((enemy.angle || 0) - angleToPlayer);
    if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

    let fov = Math.PI / 4; 
    let canSeePlayer = (distance < 400 && angleDiff < fov);

    // 4. TRIGGER PANIC (Combines vision and blade/proximity)
    let isThreatened = (bladeActive && !stealthActive && distance < 400) || 
                       (distance < 50) || 
                       (canSeePlayer);

    if (isThreatened) {
        enemy.scaredTimer = 120; 
    }

    // 5. ROTATION & MOVEMENT LOGIC
    if (enemy.scaredTimer > 0) {
        enemy.scaredTimer--;
        enemy.color = 'yellow';
        
        let angle = Math.atan2(dy, dx);
        enemy.x -= Math.cos(angle) * 7; 
        enemy.y -= Math.sin(angle) * 7;
        enemy.angle = angle + Math.PI; // Face away while running
    } else {
        enemy.color = 'white';
        enemy.angle = (enemy.angle || 0) + 0.01; // Slowly spin radar

        let hDx = (enemy.homeX || 0) - enemy.x;
        let hDy = (enemy.homeY || 0) - enemy.y;
        let distToHome = Math.sqrt(hDx * hDx + hDy * hDy);
        
        if (distToHome > 5) {
            let aHome = Math.atan2(hDy, hDx);
            enemy.x += Math.cos(aHome) * 3;
            enemy.y += Math.sin(aHome) * 3;
        }
    }

    // 6. DRAWING THE VISION CONE
    ctx.save();
    ctx.translate(enemy.x + enemy.size/2, enemy.y + enemy.size/2);
    ctx.rotate(enemy.angle);
    ctx.fillStyle = "rgba(255, 255, 0, 0.15)"; 
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0, 0, 400, -fov, fov); 
    ctx.fill();
    ctx.restore();

    // 7. DRAWING THE ENEMY
    ctx.fillStyle = enemy.color;
    ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
    
    ctx.fillStyle = "black";
    ctx.fillRect(enemy.x + 5, enemy.y + 5, 10, 10); 
    ctx.fillRect(enemy.x + enemy.size - 15, enemy.y + 5, 10, 10);
});
        drawRect(posX, posY);

            // --- HUD (FIXED BRACKETS) ---
            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            if (stealthActive) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(20, 20, 240, 90);
                ctx.strokeStyle = bladeActive ? "cyan" : "red"; 
                ctx.lineWidth = 3;
                ctx.strokeRect(20, 20, 240, 90);

                ctx.fillStyle = "white";
                ctx.font = "bold 14px monospace";
                ctx.fillText("» STEALTH ACTIVE", 40, 45);
                ctx.fillText("» BLADE: " + (bladeActive ? "READY" : "HIDDEN"), 40, 70);
            }

            requestAnimationFrame(animate);
        };
        

        animate();

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;
            if (key === 'e') stealthActive = !stealthActive;
            if (key === 'shift') speedMultiplier = sprintSpeed;
            if (key === ' ') {
                bladeActive = true;
                enemies.forEach(enemy => {
                    let d = Math.sqrt((posX-enemy.x)**2 + (posY-enemy.y)**2);
                    if (d < 100) enemy.isDead = true; enemy.respawnTimer = 300;
                });
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = false;
            if (key === ' ') bladeActive = false;
            if (key === 'shift') speedMultiplier = 1;
        });
    </script>
</body>
</html>
