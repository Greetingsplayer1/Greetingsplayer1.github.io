<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Animate</title>
        <style>
            canvas { border: 1px solid black; }
        </style>
    </head>
    <body>
        <h2>Hello animations</h2>
        <canvas id="myCanvas" width="600" height="400"></canvas>

        <script>
            console.log("hi")
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// 1. Create a variable to track position
let posX = 50; 
let posY = 100;
let speedX = 5;
let speedY = 5;
let radius = 5;
let particles = [];
let keys = {};


    // Clear the whole canvas before drawing the new position
function drawRect(x, y) {
    
    ctx.fillStyle = 'tan';
    ctx.fillRect(x, y, 60, 60);

    ctx.fillStyle = 'tan';
    ctx.fillRect(x+20, y+-30, 20, 40);

ctx.fillStyle = 'tan';
ctx.beginPath();
ctx.arc(x + 30, y + -50, 35, 0, 2 * Math.PI); 
ctx.fill();

ctx.fillStyle = 'white';
ctx.beginPath();
ctx.arc(x + 50, y + -50, radius, 0, 2 * Math.PI); 
ctx.fill();

ctx.fillStyle = 'white';
ctx.beginPath();
ctx.arc(x + 10, y + -50, radius, 0, 2 * Math.PI); 
ctx.fill();

    ctx.fillStyle = 'tan';
    ctx.fillRect(x, y+60, 20, 40);
    
    ctx.fillStyle = 'tan';
    ctx.fillRect(x+40, y+60, 20, 40);

    ctx.fillStyle = 'tan';
    ctx.fillRect(x+70, y, 20, 50,);

    ctx.fillStyle = 'tan';
    ctx.fillRect(x+-30, y, 20, 50,);
}



function animate() {  
    ctx.clearRect(0, 0, canvas.width, canvas.height); 

    // Move only if the key is currently held down
    if (keys['ArrowRight']) posX += 5;
    if (keys['ArrowLeft'])  posX -= 5;
    if (keys['ArrowUp'])    posY -= 5;
    if (keys['ArrowDown'])  posY += 10; // Making down slightly faster

    drawRect(posX, posY);
    requestAnimationFrame(animate);
}

// Start the loop
animate();
window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => { keys[e.key] = false; });
        </script>
    </body>
</html>
