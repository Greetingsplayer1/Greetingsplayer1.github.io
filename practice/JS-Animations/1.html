<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Animate</title>
        <style>
            canvas { border: 1px solid black; }
        </style>
    </head>
    <body>
        <h2>Hello animations</h2>
        <canvas id="myCanvas" width="600" height="400"></canvas>

        <script>
            console.log("hi")
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// 1. Create a variable to track position
let posX = 50; 
let speedX = 5;
let speedY = 5;
let radius = 5;


    // Clear the whole canvas before drawing the new position
function drawRect(x, y) {
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
    
    ctx.fillStyle = 'tan';
    ctx.fillRect(x, y, 60, 60);

    ctx.fillStyle = 'tan';
    ctx.fillRect(x+20, y+-30, 20, 40);

ctx.fillStyle = 'tan';
ctx.beginPath();
ctx.arc(x + 30, y + -50, 35, 0, 2 * Math.PI); 
ctx.fill();

ctx.fillStyle = 'white';
ctx.beginPath();
ctx.arc(x + 50, y + -50, radius, 0, 2 * Math.PI); 
ctx.fill();

ctx.fillStyle = 'white';
ctx.beginPath();
ctx.arc(x + 10, y + -50, radius, 0, 2 * Math.PI); 
ctx.fill();

    ctx.fillStyle = 'tan';
    ctx.fillRect(x, y+60, 20, 40);
    
    ctx.fillStyle = 'tan';
    ctx.fillRect(x+40, y+60, 20, 40);

    ctx.fillStyle = 'tan';
    ctx.fillRect(x+70, y, 20, 50,);

    ctx.fillStyle = 'tan';
    ctx.fillRect(x+-30, y, 20, 50,);
}

function animate() {

    // 2. Update the position variable
    posX += speedX;

    // 3. Reset position if it goes off screen
if (posX + 90 > canvas.width || posX < 0) {
    speedX = (posX < 0 ? 1 : -1) * (Math.random() * 5 + 2); 

        speedY = (Math.random() - 0.5) * 10; 
        }

    // 4. Draw at the NEW position
    drawRect(posX, 150);

requestAnimationFrame(animate)
}

// Start the loop
animate();
        </script>
    </body>
</html>
