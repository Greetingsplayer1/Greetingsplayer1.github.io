<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arlington Weather | Live Updates</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.1);
    --accent-blue: #38bdf8;
    --text-main: #f8fafc;
    --text-dim: #94a3b8;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg-gradient);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
}

.glass-card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 2.5rem;
    width: 380px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
}

.location-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(56, 189, 248, 0.1);
    padding: 6px 12px;
    border-radius: 20px;
}

.location-badge h1 {
    font-size: 0.9rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.5px;
    color: var(--accent-blue);
}

.main-display {
    text-align: center;
    margin-bottom: 2.5rem;
}

.condition-text {
    font-size: 1.1rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
}

.temperature-big {
    font-size: 5rem;
    font-weight: 300;
    letter-spacing: -2px;
}

.stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    border-top: 1px solid var(--glass-border);
    padding-top: 1.5rem;
}

.stat-box {
    display: flex;
    align-items: center;
    gap: 12px;
}

.stat-content {
    display: flex;
    flex-direction: column;
}

.label {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 1px;
}

.value {
    font-weight: 600;
    font-size: 0.95rem;
}

.icon-blue { color: var(--accent-blue); width: 20px; }
.icon-small { width: 14px; }

/* Status Dot Animation */
.dot-pulse {
    width: 8px;
    height: 8px;
    background-color: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
    animation: pulse 3s infinite;
}

#description {
    font-size: 1.5rem; /* Makes the emoji and text larger */
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}


@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

.feeling-text {
    color: black;
    font-size: 1.4rem;
}

    </style>
</head>
<body>

    <main class="weather-container">
        <div class="glass-card">
            <header class="card-header">
                <div class="location-badge">
                    <i data-lucide="map-pin" class="icon-small"></i>
                    <h1>Arlington, VA</h1>
                </div>
                <div id="status-dot" class="dot-pulse"></div>
            </header>

            <div class="main-display">
                <div id="description" class="condition-text">Fetching weather...</div>
                <div id="temp" class="temperature-big">--°</div>
                <div class="feeling-text">Feels like: <span id="feels-like">--°</span></div>
            </div>
            
            <footer class="stats-grid">
                <div class="stat-box">
                    <i data-lucide="wind" class="icon-blue"></i>
                    <div class="stat-content">
                        <span class="label">Wind Speed</span>
                        <span id="wind" class="value">-- mph</span>
                    </div>
                </div>

                <div class="stat-box">
                    <i data-lucide="navigation" class="icon-blue"></i>
                    <div class="stat-content">
                        <span class="label">Direction</span>
                        <span id="direction" class="value">--°</span>
                    </div>
                </div>
            </footer>
        </div>
    </main>

    <script src="weather.js"></script>
</body>
</html>
