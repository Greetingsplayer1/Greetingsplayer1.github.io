<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arlington Weather | Live Updates</title>
    <style>
        :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.1);
    --accent-blue: #38bdf8;
    --text-main: #f8fafc;
    --text-dim: #94a3b8;
}

body {
    margin: 0;
    min-height: 100vh;      /* Use min-height instead of height */
    width: 100%;
    display: flex;
    flex-direction: column; /* Stack things vertically */
    align-items: center;    /* Center them left-to-right */
    justify-content: flex-start; /* Start from the TOP */
    padding-top: 40px;      /* THIS creates the "buffer" from the tab bar */
    background: var(--bg-gradient);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
}

.glass-card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 2.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    width: 400px;
}



.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
}

.location-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(56, 189, 248, 0.1);
    padding: 6px 12px;
    border-radius: 20px;
}

.location-badge h1 {
    font-size: 0.9rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.5px;
    color: var(--accent-blue);
}

.main-display {
    text-align: center;
    margin-bottom: 2.5rem;
}

.condition-text {
    font-size: 1.1rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
}

.temperature-big {
    font-size: 5rem;
    font-weight: 300;
    letter-spacing: -2px;
}

.stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    border-top: 1px solid var(--glass-border);
    padding-top: 1.5rem;
}

.stat-box {
    display: flex;
    align-items: center;
    gap: 12px;
}

.stat-content {
    display: flex;
    flex-direction: column;
}

.label {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 1px;
}

.value {
    font-weight: 600;
    font-size: 0.95rem;
}

.icon-blue { color: var(--accent-blue); width: 20px; }
.icon-small { width: 14px; }

/* Status Dot Animation */
.dot-pulse {
    width: 8px;
    height: 8px;
    background-color: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
    animation: pulse 3s infinite;
}

#description {
    font-size: 1.5rem; /* Makes the emoji and text larger */
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}


@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

.feeling-text {
    font-size: 1.4rem;
}

/* Container to stack things vertically */
.weather-container {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    align-items: center;
    width: 604px;
}

/* Groups Main Card and Stats side-by-side */
.top-section {
    display: flex;
    flex-direction: row;
    gap: 1.5rem;
    width: 100%;
    justify-content: center;
}

/* Vertical Stats Bubbles */
.stats-bubbles {
    display: flex;
    flex-direction: column; /* Changed from grid to column */
    gap: 1rem;
    width: 180px; /* Fixed width for the side bubbles */
}

.bubble {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 1.5rem; /* Made thicker */
    flex: 1; /* Makes all 3 bubbles equal height to match Hero Card */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.bubble .label {
    font-size: 0.65rem;
    margin-bottom: 5px;
}

.bubble .value {
    font-size: 1.1rem;
    color: var(--accent-blue);
}


.forecast-card {
    width: 100%; /* Spans across both top sections */
    padding: 2.5rem 1.5rem; /* Increased top/bottom padding for "thickness" */
    box-sizing: border-box;
}

.forecast-list {
    display: flex;
    justify-content: space-between;
    text-align: center;
}

.day-item {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.day-name {
    font-size: 0.9rem;
    font-weight: 70;
    color: var(--accent-blue);
    margin-bottom: 5px;
}

.day-icon {
    font-size: 2rem; /* Much bigger icon */
    margin: 10px 0;
}

.day-temp {
    font-size: 1.2rem; /* Much bigger temperature */
    font-weight: 700;
}


    </style>
</head>
<body>

<main class="weather-container">
    <div class="top-section">
        <!-- Main Hero Card -->
        <div class="glass-card hero-card">
            <header class="card-header">
                <div class="location-badge">    
                    <h1>Arlington, VA</h1>
                </div>
                <div id="status-dot" class="dot-pulse"></div>
            </header>

            <div class="main-display">
                <div id="description" class="condition-text">Fetching...</div>
                <div id="temp" class="temperature-big">--°</div>
            </div>
        </div>

        <!-- Stats Bubbles (Now Vertical) -->
        <div class="stats-bubbles">
            <div class="bubble">
                <span class="label">Feels Like</span>
                <span id="feels-like" class="value">--°</span>
            </div>
            <div class="bubble">
                <span class="label">Wind Speed</span>
                <span id="wind" class="value">-- mph</span>
            </div>
            <div class="bubble">
                <span class="label">Direction</span>
                <span id="direction" class="value">--°</span>
            </div>
        </div>
    </div>

    <!-- Forecast Card (Now wider and thicker) -->
    <div class="glass-card forecast-card">
        <div id="forecast-list" class="forecast-list">
            <!-- Days injected here -->
        </div>
    </div>
</main>



    <script src="weather.js"></script>
</body>
</html>
