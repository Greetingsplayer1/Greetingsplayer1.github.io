<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Animate</title>
        <style>
            canvas { border: 1px solid black; }
        </style>
    </head>
    <body>
        <h2>Hello animations</h2>
        <canvas id="myCanvas" width="600" height="400"></canvas>

        <script>
            console.log("hi")
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// 1. Create a variable to track position
let posX = 50; 
let speed = 2; // How many pixels to move per frame


    // Clear the whole canvas before drawing the new position
function drawRect(x, y) {
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
    
    ctx.fillStyle = 'blue';
    ctx.fillRect(x, y, 50, 50);
}

function animate() {

    // 2. Update the position variable
    posX += speed;

    // 3. Reset position if it goes off screen
    if (posX > canvas.width) {
        posX = -50; 
    }

    // 4. Draw at the NEW position
    drawRect(posX, 150);

    requestAnimationFrame(animate);
}

// Start the loop
animate();
        </script>
    </body>
</html>
