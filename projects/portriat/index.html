<!DOCTYPE html>
<html lang="en">
<head>
<title>Canvas Practice</title>  
<style>
    #sean{
        border: black solid 2px;
    }
</style>
</head>
<body>
<h1>Self Portriat</h1>
<canvas id="sean" width="840" height="700">
</canvas>
<script>
    //MAGIC
    const canvas = document.getElementById('sean');
    const ctx = canvas.getContext('2d');

    //background
    ctx.fillStyle = 'gray';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    //big circle in the middle tan
    ctx.fillStyle = '#E7C39C';
    ctx.beginPath();
    ctx.arc(400, 250, 200, 0, Math.PI * 2);
    ctx.fill();

    //left eye ellipse white
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.ellipse(300, 200, 50, 30, 0, 0, Math.PI * 2);
    ctx.fill();

    //right eye ellipse white
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.ellipse(500, 200, 50, 30, 0, 0, Math.PI * 2);
    ctx.fill();

    //left pupil elipses black wide
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.ellipse(300, 200, 20, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    //right pupil elipses black
    ctx.beginPath();
    ctx.ellipse(500, 200, 20, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    //mouth red
    ctx.fillStyle = 'red';
    ctx.beginPath();
    ctx.arc(400, 310, 100, 0, Math.PI);
    ctx.fill();

    //neck tan rectanlge width 80 height 100
    ctx.fillStyle = '#E7C39C';
    ctx.fillRect(331, 430, 130, 100);

    //body ellipse tan with border 2px black
    ctx.fillStyle = '#E7C39C';
    ctx.beginPath();
    ctx.ellipse(400, 760, 250, 300, 3.14, 0, Math.PI * 2);
    ctx.fill();

//shirt ellipse cover the body
    ctx.fillStyle = 'blue';
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(400, 760, 250, 300, 3.14, 0, Math.PI * 1);
    ctx.fill();
    ctx.stroke();

    //nose triangle dark tan in middle of face
    ctx.fillStyle = 'peru';
    ctx.beginPath();
    ctx.moveTo(400, 220);
    ctx.lineTo(370, 260);
    ctx.lineTo(430, 260);
    ctx.closePath();
    ctx.fill();

    //nostrils two black dots on the nose
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(385, 250, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(415, 250, 5, 0, Math.PI * 2);
    ctx.fill();

    //ears two tan ellipses on the sides of the head
    ctx.fillStyle = '#E7C39C';
    ctx.beginPath();
    ctx.ellipse(200, 250, 40, 60, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(600, 250, 40, 60, 0, 0, Math.PI * 2);
    ctx.fill();

    //ear holes two black circles in the middle of the ears
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(200, 250, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(600, 250, 15, 0, Math.PI * 2);
    ctx.fill();

    //hair part 1 brown hollow arch on top of head
    ctx.strokeStyle = 'saddleBrown';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(400, 250, 200, Math.PI, 0);
    ctx.stroke();

    //hair sub part 1.5 brown hollow arch on top of head but smaller
    ctx.beginPath();
    ctx.arc(400, 250, 195, Math.PI, 0);
    ctx.stroke();

    //hair part 2 anothe rbrown hollow arch on top of head but smaller
    ctx.beginPath();
    ctx.arc(400, 250, 190, Math.PI, 0);
    ctx.stroke();

    //hair sub part 2.5 brown hollow arch on top of head but smaller
    ctx.beginPath();
    ctx.arc(400, 250, 185, Math.PI, 0);
    ctx.stroke();

    //hair part 3 anothe rbrown hollow arch on top of head but smaller
    ctx.beginPath();
    ctx.arc(400, 250, 180, Math.PI, 0);
    ctx.stroke();

    //hair sub part 3.5 brown hollow arch on top of head but smaller
    ctx.beginPath();
    ctx.arc(400, 250, 175, Math.PI, 0);
    ctx.stroke();

    //ellipses hair part 6 bangs small ellipses brown on forehead
    ctx.fillStyle = 'saddlebrown';
    ctx.beginPath();
    ctx.ellipse(400, 110, 110, 40, 0, 0, Math.PI * 2);
    ctx.fill();

    //lips dark reed line across mout bottom and top
    ctx.strokeStyle = 'darkred';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(300, 310);
    ctx.lineTo(500, 310);
    ctx.stroke();


    //lips sub part 1 dark reed hollow arch across mouth bottom
    ctx.beginPath();
    ctx.arc(400, 310, 100, 0, Math.PI);
    ctx.stroke();

    //goofy dude in backgrougnd an ellipses with a face on it
    ctx.fillStyle = '#E7C39C';
    ctx.beginPath();
    ctx.ellipse(700, 100, 50, 50, 0,    0, Math.PI * 2);
    ctx.fill();

    //face on goofy dude two black dots for eyes and a red line for a mouth
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(690, 90, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(710, 90, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(690, 110);
    ctx.lineTo(710, 110);
    ctx.stroke();
 
    //glasses for goofy dude two black circles around the eyes and a line connecting them
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(690, 90, 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(710, 90, 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(680, 90);
    ctx.lineTo(720, 90);
    ctx.stroke();

    //goofy dude hair a brown line across the top of the head
    ctx.strokeStyle = 'saddlebrown';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(690, 50);
    ctx.lineTo(720, 50);
    ctx.stroke();

    //glasses side lines two black lines from the glasses to the ears
    ctx.strokeStyle = 'black';
    ctx.beginPath();
    ctx.moveTo(680, 90);
    ctx.lineTo(653,80);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(720, 90);
    ctx.lineTo(748, 80);
    ctx.stroke();

    //goofy dude text bubbl ellipse with text in it that says text bubble
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.ellipse(600, 50, 60, 30, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'black';
    ctx.font = '12px Arial';
    ctx.fillText('Hi I am sebastian', 545, 55);

    //ears for goofy dude two tan ellipses on the sides of the head
    ctx.fillStyle = '#E7C39C';
    ctx.beginPath();
    ctx.ellipse(650, 100, 9, 13, -3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(750, 100, 9, 13, 3.5, 0, Math.PI * 2);
    ctx.fill();

        //ear hole on goofy dude two black dots for eyes and a red line for a mouth
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(648, 100, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(710, 90, 5, 0, Math.PI * 2);
    ctx.fill();

    //ear hole on goofy dude two black dots for eyes and a red line for a mouth
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(753, 100, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(710, 90, 5, 0, Math.PI * 2);
    ctx.fill();

    //arm waving hi ellipses
    ctx.fillStyle = 'blue';
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 2; 
    ctx.beginPath();
    ctx.ellipse(680, 540, 50, 150, .5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    //hand circle
    ctx.fillStyle = "#E7C39C"
    ctx.beginPath();
    ctx.arc(730, 450, 70, 0, Math.PI * 2)
    ctx.fill();

//finger 1
ctx.fillStyle = "#E7C39C"
ctx.beginPath();
ctx.ellipse(660,430, 20, 50, Math.PI / -4, 0, Math.PI * 2);
ctx.fill();

//finger 1
ctx.fillStyle = "#E7C39C"
ctx.beginPath();
ctx.ellipse(700, 380, 20, 50, 0, 0, Math.PI * 2);
ctx.fill();

//finger 1
ctx.fillStyle = "#E7C39C"
ctx.beginPath();
ctx.ellipse(750, 380, 20, 50, 0, 0, Math.PI * 2);
ctx.fill();

//finger 1
ctx.fillStyle = "#E7C39C"
ctx.beginPath();
ctx.ellipse(790, 410, 20, 50, .4, 0, Math.PI * 2);
ctx.fill();


</script>
</body>
